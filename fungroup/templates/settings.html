{% extends 'base.html' %}

{% block content %}
<a href="/" style="text-decoration: none; color: #007bff; font-weight: bold;">← Назад на главную</a>
<h2>Настройки аккаунта</h2>
<hr style="border: none; border-top: 1px solid var(--border-color); margin-bottom: 20px;">

<form method="POST" style="max-width: 500px;">
    
    <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: bold; margin-bottom: 8px;">Тема оформления сайта:</label>
        <select name="theme" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);">
            <option value="light" {% if theme == 'light' %}selected{% endif %}>Светлая тема ☀️</option>
            <option value="dark" {% if theme == 'dark' %}selected{% endif %}>Темная тема 🌙</option>
        </select>
    </div>

    <div style="margin-bottom: 25px;">
        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
            <input type="checkbox" name="notifications" {% if notifications %}checked{% endif %} style="width: 18px; height: 18px;">
            <span>Включить звуковые уведомления о сообщениях</span>
        </label>
    </div>

    <button type="submit" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
        Сохранить настройки
    </button>
</form>
{% endblock %}

{% block sidebar %}
<div class="stat-card">
    <h4>Статус профиля</h4>
    <div class="stat-value" style="color: #28a745;">Активен ✅</div>
</div>
{% endblock %}
