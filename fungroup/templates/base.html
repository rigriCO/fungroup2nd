<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FunGr😊up — Поиск партнёров</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg-color, #f7f9fc); color: var(--text-color, #333); transition: background 0.3s, color 0.3s; }
        
        body.light { --bg-color: #f7f9fc; --card-bg: #fff; --text-color: #333; --border-color: #e0e0e0; }
        body.dark { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --border-color: #333; }

        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 12px 30px; }
        .logo { font-size: 26px; font-weight: bold; color: var(--text-color); text-decoration: none; }
        
        .header-right { display: flex; align-items: center; gap: 20px; }
        .nav-btn { text-decoration: none; color: var(--text-color); font-weight: 600; font-size: 14px; opacity: 0.8; }
        .nav-btn:hover { opacity: 1; }
        
        .profile-dropdown { position: relative; display: inline-block; }
        .avatar-btn { width: 42px; height: 42px; border-radius: 50%; background: #ff9800; color: white; border: 2px solid #e0e0e0; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .dropdown-content { display: none; position: absolute; right: 0; top: 50px; background-color: var(--card-bg); min-width: 190px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--border-color); z-index: 100; overflow: hidden; }
        .dropdown-content.show { display: block; }
        
        .dropdown-content a { color: var(--text-color); padding: 10px 16px; text-decoration: none; display: block; font-size: 14px; }
        .dropdown-content a:hover { background-color: rgba(0, 123, 255, 0.1); }
        
        .auth-links { display: flex; gap: 10px; }
        .btn-auth { padding: 8px 14px; border-radius: 6px; font-size: 14px; text-decoration: none; font-weight: 600; }
        .btn-login { background: transparent; color: #007bff; border: 1px solid #007bff; }
        .btn-reg { background: #007bff; color: white; }

        .layout { display: flex; max-width: 1300px; margin: 25px auto; gap: 20px; padding: 0 15px; }
        .main-content { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .sidebar { width: 300px; }
        
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin-bottom: 15px; font-size: 14px; }
        .stat-card h4 { margin-top: 0; margin-bottom: 8px; opacity: 0.7; font-size: 13px; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--border-color); padding: 12px; text-align: left; color: var(--text-color); }
        tr:nth-child(even) { background-color: rgba(0,0,0,0.02); }
        tr:hover { background-color: rgba(0, 123, 255, 0.05); cursor: pointer; }
    </style>
</head>
<body class="{{ theme }}">

    <header>
        <a href="/" class="logo">FunGr😊up</a>
        
        <div class="header-right">
            <a href="/messages" class="nav-btn">СООБЩЕНИЯ</a>
            
            {% if logged_in_user %}
                <div class="profile-dropdown">
                    <button class="avatar-btn" onclick="toggleMenu(event)">{{ logged_in_user[0] | upper }}</button>
                    <div id="profileMenu" class="dropdown-content">
                        <a href="#"><strong>{{ logged_in_user }}</strong><br><small style="opacity: 0.6;">Профиль</small></a>
                        <hr style="margin:0; border:none; border-top:1px solid var(--border-color);">
                        <a href="/settings">Настройки</a>
                        <a href="#">Язык: Русский 🇷🇺</a>
                        <a href="/logout" onclick="return confirmExit(event)" style="color: #d9534f;">Выйти</a>
                    </div>
                </div>
            {% else %}
                <div class="auth-links">
                    <a href="/login" class="btn-auth btn-login">Войти</a>
                    <a href="/register" class="btn-auth btn-reg">Регистрация</a>
                </div>
            {% endif %}
        </div>
    </header>

    <div class="layout">
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
        
        <div class="sidebar">
            {% block sidebar %}{% endblock %}
        </div>
    </div>

    <script>
        function toggleMenu(event) {
            event.stopPropagation();
            document.getElementById("profileMenu").classList.toggle("show");
        }

        function confirmExit(event) {
            if (!confirm("Вы действительно хотите выйти из аккаунта?")) {
                event.preventDefault();
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.avatar-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
